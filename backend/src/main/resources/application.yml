spring:
  autoconfigure:
    # Users come from the database; skip Boot's generated in-memory user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: art-bazaar
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/artbazaar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:artbazaar}
    password: ${DB_PASSWORD:artbazaar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    # Base64-encoded HMAC key of at least 256 bits. The default is for local development only:
    # always set JWT_SECRET in any shared or deployed environment (openssl rand -base64 48).
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLWFydGJhemFhcg==}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    # true in production (HTTPS); false lets the cookie work over plain http://localhost
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  admin:
    # When both are set, an admin account with these credentials is created at startup if missing.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
